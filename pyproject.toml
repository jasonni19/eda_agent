[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "object-eda-agent"
version = "0.1.0"
description = "A tool-using LangChain agent for schema-validated exploratory data analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "matplotlib>=3.9,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
eda-agent = "eda_agent.cli:main"
eda-api = "eda_agent.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
